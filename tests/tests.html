<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TokoTally — tests</title>
    <style>
      body { font: 14px ui-monospace, Menlo, Consolas, monospace; margin: 24px; background:#0e1116; color:#f2f5f8; }
      h1 { font-size: 18px; }
      .pass { color: #2dd4bf; }
      .fail { color: #f87171; }
      .group { margin: 14px 0 6px; color: #9aa6b2; font-weight: bold; }
      li { margin: 2px 0; }
      #summary { margin-top: 20px; padding: 10px; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>TokoTally — core parity tests</h1>
    <p style="color:#9aa6b2">
      Cases in <code>fixture.json</code> are produced by the real Python
      backend (<code>tools/gen_fixture.py</code>); these assert the
      JavaScript port agrees with it.
    </p>
    <div id="out"></div>
    <div id="summary"></div>

    <script type="module">
      import {
        PRICE_MULTIPLIER,
        discountFactor,
        formatDateDisplay,
        formatMoney,
        formatNumber,
        lineTotal,
        saleTotal,
        subtotal,
        ppnAmount,
        ppnLabel,
        PPN_RATE,
        parseField,
        parseUserDate,
        effectiveDate,
        formatTime,
        nowStamp,
        todayIso,
      } from '../js/core.js';
      import { Database } from '../js/db.js';
      import { SettingsStore } from '../js/store.js';

      const out = document.getElementById('out');
      let pass = 0;
      let fail = 0;

      // Cases and their values are built as text nodes, never as markup.
      // A fixture is generated data — a case whose input happened to
      // contain a tag would otherwise be parsed as one, and a test page
      // that can be steered by its own fixture is not a test page.
      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function group(name) {
        out.append(element('div', 'group', name));
        const list = element('ul');
        out.append(list);
        return list;
      }

      function check(list, label, actual, expected) {
        // Floats: compare within a tolerance rather than bit-for-bit.
        const ok =
          typeof expected === 'number' && typeof actual === 'number'
            ? Math.abs(actual - expected) < 1e-9
            : actual === expected;
        ok ? pass++ : fail++;
        const row = element('li', ok ? 'pass' : 'fail',
                            `${ok ? 'PASS' : 'FAIL'} ${label}`);
        if (!ok) {
          row.append(' — got ');
          row.append(element('b', null, JSON.stringify(actual)));
          row.append(', expected ');
          row.append(element('b', null, JSON.stringify(expected)));
        }
        list.append(row);
      }

      const fixture = await (await fetch('fixture.json', { cache: 'no-store' })).json();

      // --- constants ---------------------------------------------------
      let g = group('constants');
      check(g, 'PRICE_MULTIPLIER', PRICE_MULTIPLIER, fixture.priceMultiplier);

      // --- discount chains ---------------------------------------------
      g = group(`discountFactor (${fixture.discountFactor.length} cases from Python)`);
      for (const c of fixture.discountFactor) {
        check(g, `discountFactor(${JSON.stringify(c.input)})`, discountFactor(c.input), c.expected);
      }

      // --- date parsing -------------------------------------------------
      g = group(`parseUserDate (${fixture.parseUserDate.length} cases from Python)`);
      for (const c of fixture.parseUserDate) {
        check(g, `parseUserDate(${JSON.stringify(c.input)})`, parseUserDate(c.input), c.expected);
      }

      g = group(`formatDateDisplay (${fixture.formatDateDisplay.length} cases from Python)`);
      for (const c of fixture.formatDateDisplay) {
        check(g, `formatDateDisplay(${JSON.stringify(c.input)})`, formatDateDisplay(c.input), c.expected);
      }

      // --- the money rule ------------------------------------------------
      g = group(`lineTotal (${fixture.lineTotal.length} cases from Python)`);
      for (const c of fixture.lineTotal) {
        check(
          g,
          `${c.qty} x ${c.price} disc ${JSON.stringify(c.discount)}`,
          lineTotal({ qty: c.qty, price: c.price, discount: c.discount }),
          c.expected
        );
      }

      // --- PPN, the tax on top of the lines --------------------------------
      g = group(`saleTotal (${fixture.saleTotal.length} cases from Python)`);
      check(g, 'PPN_RATE', PPN_RATE, fixture.ppnRate);
      for (const c of fixture.saleTotal) {
        const at = c.rate === 0 ? 'untaxed' : `at ${c.rate}`;
        check(g, `${c.items.length} line(s) ${at}`,
          saleTotal(c.items, c.rate), c.expected);
      }
      // The parts the breakdown shows must add up to what is charged.
      const taxed = [{ qty: 1, price: 1646, discount: '' }];
      check(g, 'subtotal is the lines before tax', subtotal(taxed), 1646000);
      check(g, 'ppnAmount is the tax alone',
        ppnAmount(subtotal(taxed), PPN_RATE), 181060);
      check(g, 'subtotal + ppn = grand total',
        subtotal(taxed) + ppnAmount(subtotal(taxed), PPN_RATE),
        saleTotal(taxed, PPN_RATE));
      check(g, 'a missing rate means untaxed', saleTotal(taxed), 1646000);
      // 0.11 * 100 is 11.000000000000002 in binary floating point.
      check(g, 'label carries no float dust', ppnLabel(), 'PPN 11%');

      // --- formatting (id-ID convention, asserted directly) --------------
      g = group('formatting');
      check(g, 'formatNumber(1600000, 3)', formatNumber(1600000, 3), '1.600.000,000');
      check(g, 'formatNumber(1250000, 0)', formatNumber(1250000, 0), '1.250.000');
      check(g, 'formatNumber(0, 3)', formatNumber(0, 3), '0,000');
      check(g, 'formatNumber(-2000, 2)', formatNumber(-2000, 2), '-2.000,00');
      check(g, 'formatMoney with symbol', formatMoney(1250000, 3, 'Rp'), 'Rp 1.250.000,000');
      check(g, 'formatMoney with no symbol', formatMoney(1250000, 3, ''), '1.250.000,000');

      // --- field parsing (comma as decimal separator) --------------------
      g = group('parseField');
      check(g, "parseField('12,5')", parseField('12,5'), 12.5);
      check(g, "parseField('12.5')", parseField('12.5'), 12.5);
      check(g, "parseField('')", parseField(''), 0);
      check(g, "parseField('abc')", parseField('abc'), 0);
      check(g, "parseField('-3')", parseField('-3'), -3);

      // --- timestamps ----------------------------------------------------
      g = group('timestamps');
      check(g, "formatTime('2026-08-04 14:32:09')", formatTime('2026-08-04 14:32:09'), '14:32');
      check(g, 'formatTime(garbage) passes through', formatTime('nope'), 'nope');
      check(g, 'nowStamp shape', /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(nowStamp()), true);
      check(g, 'todayIso shape', /^\d{4}-\d{2}-\d{2}$/.test(todayIso()), true);
      check(g, 'nowStamp starts with todayIso', nowStamp().startsWith(todayIso()), true);
      // A sale date, when set, overrides the logged-at day for the Today KPI.
      check(g, 'effectiveDate prefers saleDate',
        effectiveDate({ saleDate: '2026-01-02', createdAt: '2026-08-04 10:00:00' }), '2026-01-02');
      check(g, 'effectiveDate falls back to createdAt',
        effectiveDate({ saleDate: '', createdAt: '2026-08-04 10:00:00' }), '2026-08-04');

      // --- hardening: values that arrive from outside the app -----------
      // A backup file is hand-editable and a settings row outlives the
      // build that wrote it, so both are parsed defensively. These run
      // against a throwaway database, not the ledger in this browser.
      g = group('settings read back from storage');
      const settingsOf = (values) =>
        new SettingsStore({ setSetting: async () => {} }, values);

      // A non-numeric decimals used to reach Intl.NumberFormat and throw,
      // breaking every money readout on the page for good.
      for (const bad of ['abc', '', null, undefined, {}]) {
        const store = settingsOf({ decimals: bad });
        check(g, `decimals ${JSON.stringify(bad)} -> default`, store.decimals, 3);
      }
      check(g, 'decimals "99" clamps', settingsOf({ decimals: '99' }).decimals, 6);
      check(g, 'decimals "-4" clamps', settingsOf({ decimals: '-4' }).decimals, 0);
      check(g, 'decimals "2" kept', settingsOf({ decimals: '2' }).decimals, 2);
      let threw = false;
      try {
        settingsOf({ decimals: 'abc' }).money(1250000);
      } catch {
        threw = true;
      }
      check(g, 'money() survives a corrupt decimals', threw, false);
      check(g, 'unusable accent -> default',
        settingsOf({ accent: 'red; } body {' }).accent, '#2dd4bf');
      check(g, 'hex accent kept', settingsOf({ accent: '#f472b6' }).accent, '#f472b6');
      check(g, 'blank currency -> default', settingsOf({ currency: '' }).currency, 'Rp');

      g = group('restoring a backup file');
      const PROBE = 'tokotally-test-probe';
      const wipe = () =>
        new Promise((done) => {
          const r = indexedDB.deleteDatabase(PROBE);
          r.onsuccess = r.onerror = r.onblocked = done;
        });
      await wipe();
      const probe = await Database.open(PROBE);
      const probeLog = (await probe.allLogs())[0].id;
      await probe.insertTransaction(
        probeLog, 240000, [{ qty: 3, price: 80, discount: '' }], '',
        '2026-08-04 10:00:00'
      );

      // Refusals must leave the existing ledger untouched: importAll
      // clears every store before writing, so a payload that turns out to
      // be unusable must be rejected *before* it destroys anything.
      const refused = async (payload) => {
        try {
          await probe.importAll(payload);
          return false;
        } catch {
          return true;
        }
      };
      const survivors = async () =>
        (await probe.allTransactions((await probe.allLogs())[0].id)).length;

      check(g, 'a foreign file is refused',
        await refused({ format: 'nope' }), true);
      check(g, 'an empty backup is refused',
        await refused({ format: 'tokotally-backup' }), true);
      check(g, 'a backup whose logs have no keys is refused',
        await refused({ format: 'tokotally-backup', logs: [{ name: 'no id' }] }), true);
      check(g, 'a backup whose fields are not arrays is refused',
        await refused({ format: 'tokotally-backup', logs: 'nope' }), true);
      check(g, 'the existing ledger survived every refusal', await survivors(), 1);

      // A structurally valid backup carrying poison: the bad rows are
      // dropped or coerced, the good ones land.
      await probe.importAll({
        format: 'tokotally-backup',
        logs: [
          { id: 1, name: 'Real' },
          { id: 1, name: 'duplicate key' },
          { id: 0, name: 'unusable key' },
          { name: 'no key at all' },
        ],
        transactions: [
          { id: 1, logId: 1, seqNo: 1, total: 'not a number',
            createdAt: '2026-08-04 10:00:00', saleDate: '' },
          { id: 2, logId: 999, seqNo: 2, total: 5000,
            createdAt: '2026-08-04 10:01:00', saleDate: '' },
          { id: 3, logId: 1, seqNo: 2, total: 7000,
            createdAt: '2026-08-04 10:02:00', saleDate: '' },
        ],
        lineItems: [
          { id: 1, transactionId: 1, qty: 'x', price: null, discount: 5 },
          { id: 2, transactionId: 999, qty: 1, price: 1, discount: '' },
        ],
        settings: [{ key: 'decimals', value: 2 }, { key: '', value: 'x' }],
      });
      const restored = await probe.allLogs();
      const rows = await probe.allTransactions(restored[0].id);
      check(g, 'a duplicate/keyless log is dropped', restored.length, 1);
      check(g, 'a sale belonging to no log is dropped', rows.length, 2);
      check(g, 'a non-numeric total becomes 0, never NaN', rows[0].total, 0);
      check(g, 'a good total is kept', rows[1].total, 7000);
      check(g, 'the running total stays finite',
        Number.isFinite(await probe.runningTotal(restored[0].id)), true);
      check(g, 'a line belonging to no sale is dropped',
        (await probe.getLineItems(2)).length, 0);

      // parseBackup rebuilds each record field by field, so a dropped
      // ppnRate would quietly untax every sale a backup restores.
      await probe.importAll({
        format: 'tokotally-backup',
        logs: [{ id: 1, name: 'Taxed' }],
        transactions: [
          { id: 1, logId: 1, seqNo: 1, total: 1827060, ppnRate: 0.11,
            createdAt: '2026-08-04 10:00:00', saleDate: '' },
          { id: 2, logId: 1, seqNo: 2, total: 1646000,
            createdAt: '2026-08-04 10:05:00', saleDate: '' },
        ],
        lineItems: [],
        settings: [],
      });
      const back = await probe.allTransactions(1);
      check(g, 'a backup keeps the PPN rate it was taxed at',
        back[0].ppnRate, 0.11);
      check(g, 'and its PPN-inclusive total', back[0].total, 1827060);
      check(g, 'a sale with no rate restores as untaxed', back[1].ppnRate, 0);
      await wipe();

      document.getElementById('summary').replaceChildren(
        element('b', fail ? 'fail' : 'pass', `${pass} passed, ${fail} failed`)
      );
      window.__results = { pass, fail };
    </script>
  </body>
</html>
